<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Right hand from above, open, ready to pinch: the pinch point (13.2, 21.4) lies between the
       thumb and index tips. Each part is drawn twice, dark and wide, then light on top, so the
       outline runs around the whole hand. -->
  <defs>
    <filter id="hand-open-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.8" dy="1.6" stdDeviation="1.2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#hand-open-shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#1d1b19">
      <polygon points="24.5,33 43,34.5 44.5,42 43,49 39,54.5 33.5,56 28.5,55 24.5,50.5 23,44" fill="#1d1b19" stroke-width="8.6"/>
      <polyline points="27,48 20,42" stroke-width="13.6"/>
      <polyline points="24.5,46 16,38.5 9.5,33" stroke-width="9.6"/>
      <polyline points="26,34 23.2,23 20.2,13" stroke-width="8.9"/>
      <polyline points="31.5,33 31.2,21 30.6,9" stroke-width="9.1"/>
      <polyline points="37,33.5 38.3,22.5 39.2,12.5" stroke-width="8.8"/>
      <polyline points="42,36 44.5,27.5 46.5,20" stroke-width="7.9"/>
    </g>
    <g stroke="#fbfaf8">
      <polygon points="24.5,33 43,34.5 44.5,42 43,49 39,54.5 33.5,56 28.5,55 24.5,50.5 23,44" fill="#fbfaf8" stroke-width="6"/>
      <polyline points="27,48 20,42" stroke-width="11"/>
      <polyline points="24.5,46 16,38.5 9.5,33" stroke-width="7"/>
      <polyline points="26,34 23.2,23 20.2,13" stroke-width="6.3"/>
      <polyline points="31.5,33 31.2,21 30.6,9" stroke-width="6.5"/>
      <polyline points="37,33.5 38.3,22.5 39.2,12.5" stroke-width="6.2"/>
      <polyline points="42,36 44.5,27.5 46.5,20" stroke-width="5.3"/>
    </g>
  </g>
</svg>
